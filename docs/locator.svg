
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" aria-hidden="true">
  <defs>
    <radialGradient id="locator-cone" gradientUnits="userSpaceOnUse" cx="80" cy="80" r="62">
      <stop offset="0%" stop-color="#c2611f" stop-opacity=".5"></stop>
      <stop offset="100%" stop-color="#c2611f" stop-opacity="0"></stop>
    </radialGradient>
  </defs>

  
  <circle id="locator-accuracy" cx="80" cy="80" r="56" fill="#c2611f" fill-opacity=".1" stroke="#c2611f" stroke-opacity=".55" stroke-width="2" stroke-dasharray="5 5"></circle>

  
  <g id="locator-beam">
    <path d="M80,80 L49,26.3 A62,62 0 0,1 111,26.3 Z" fill="url(#locator-cone)"></path>
  </g>

  
  <g stroke="#1e2433" stroke-opacity=".5" stroke-width="6" stroke-linecap="round">
    <line x1="80" y1="45" x2="80" y2="54"></line>
    <line x1="80" y1="106" x2="80" y2="115"></line>
    <line x1="45" y1="80" x2="54" y2="80"></line>
    <line x1="106" y1="80" x2="115" y2="80"></line>
  </g>
  <circle cx="80" cy="80" r="22" fill="none" stroke="#1e2433" stroke-opacity=".5" stroke-width="6"></circle>

  
  <g stroke="#f4f0e8" stroke-width="3" stroke-linecap="round">
    <line x1="80" y1="45" x2="80" y2="54"></line>
    <line x1="80" y1="106" x2="80" y2="115"></line>
    <line x1="45" y1="80" x2="54" y2="80"></line>
    <line x1="106" y1="80" x2="115" y2="80"></line>
  </g>
  <circle cx="80" cy="80" r="22" fill="none" stroke="#f4f0e8" stroke-width="3"></circle>

  
  <circle id="locator-fix" cx="80" cy="80" r="9.5" fill="#c2611f" stroke="#f4f0e8" stroke-width="2"></circle>
</svg>