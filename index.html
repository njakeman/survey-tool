<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale + user-scalable=no: a stray second finger on the map
         was pinch-zooming the whole interface. Honoured in standalone mode,
         which is where the app actually runs; the map's own pinch zoom is
         unaffected (MapLibre handles its canvas touches itself). Deliberate
         accessibility trade: this app is one fixed full-screen layout with
         its own large-type styling. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- Two variants: the browser picks by scheme, so the iOS status bar
         matches the app rather than always wearing the light accent. -->
    <meta name="theme-color" content="#c2611f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16171c" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <!-- Both spellings: the standard name silences the deprecation warning,
         the apple- one is still what older iOS versions actually read. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Field Survey</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
