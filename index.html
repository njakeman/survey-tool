<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Two variants: the browser picks by scheme, so the iOS status bar
         matches the app rather than always wearing the light accent. -->
    <meta name="theme-color" content="#c2611f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16171c" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Field Survey</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
